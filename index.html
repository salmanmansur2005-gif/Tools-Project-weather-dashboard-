<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Weather & City Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-clear {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80');
        }
        .bg-cloudy {
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('https://images.unsplash.com/photo-1534088568595-a066fa41088a?auto=format&fit=crop&w=1920&q=80');
        }
        .bg-rainy {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://images.unsplash.com/photo-1519692933481-e162a57d6721?auto=format&fit=crop&w=1920&q=80');
        }
        .bg-storm {
            background-image: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), url('https://images.unsplash.com/photo-1605727216801-e27ce180cc28?auto=format&fit=crop&w=1920&q=80');
        }
    </style>
</head>
<body id="mainBody" class="min-h-screen flex items-center justify-center p-4 transition-all duration-700 text-white bg-cover bg-center bg-no-repeat bg-cloudy">

    <div class="bg-black/40 backdrop-blur-md border border-white/20 p-6 rounded-2xl shadow-2xl w-full max-w-xl">
        <div class="flex flex-col sm:flex-row gap-2 mb-4">
            <div class="flex flex-1 gap-2">
                <input type="text" id="cityInput" placeholder="Enter city name..." class="flex-1 px-4 py-2 rounded-lg bg-white/20 placeholder-white/70 text-white focus:outline-none focus:ring-2 focus:ring-white">
                <button id="searchBtn" class="bg-white text-indigo-700 font-semibold px-4 py-2 rounded-lg hover:bg-opacity-90 transition shadow">Search</button>
            </div>
            <div class="flex gap-2">
                <button id="locationBtn" title="Use Current Location" class="bg-white/20 hover:bg-white/30 px-3 py-2 rounded-lg transition flex items-center justify-center text-lg">📍</button>
                <button id="unitToggleBtn" class="bg-white/20 hover:bg-white/30 px-3 py-2 rounded-lg font-bold transition">°C</button>
            </div>
        </div>

        <div id="historyContainer" class="flex gap-2 overflow-x-auto pb-2 mb-4"></div>

        <div id="skeletonLoader" class="hidden space-y-4 animate-pulse py-6">
            <div class="h-5 bg-white/20 rounded w-1/3 mx-auto"></div>
            <div class="h-14 bg-white/20 rounded w-1/2 mx-auto"></div>
            <div class="grid grid-cols-3 gap-3">
                <div class="h-20 bg-white/20 rounded"></div>
                <div class="h-20 bg-white/20 rounded"></div>
                <div class="h-20 bg-white/20 rounded"></div>
            </div>
        </div>

        <div id="weatherDisplay" class="text-center hidden">
            <p id="localTime" class="text-sm text-white/80 mb-1">--</p>
            <h2 id="cityName" class="text-3xl font-bold mb-1">--</h2>
            <div class="flex items-center justify-center gap-2 mb-4">
                <span id="weatherIcon" class="text-3xl">☀️</span>
                <p id="weatherDesc" class="text-lg text-white/80 capitalize">--</p>
            </div>
            
            <div class="text-6xl font-extrabold mb-6" id="temp">--°C</div>
            
            <div class="grid grid-cols-3 gap-3 bg-black/30 p-4 rounded-xl mb-6 border border-white/10">
                <div>
                    <p class="text-xs text-white/70">Humidity</p>
                    <p id="humidity" class="text-lg font-bold">--%</p>
                </div>
                <div>
                    <p class="text-xs text-white/70">Wind Speed</p>
                    <p id="windSpeed" class="text-lg font-bold">-- km/h</p>
                </div>
                <div>
                    <p class="text-xs text-white/70">Air Quality</p>
                    <p id="aqi" class="text-sm font-bold mt-1">--</p>
                </div>
            </div>

            <h3 class="text-left font-semibold text-sm mb-2 text-white/90">5-Day Forecast</h3>
            <div id="forecastContainer" class="grid grid-cols-5 gap-2 text-center"></div>
        </div>
        
        <p id="errorMsg" class="text-red-300 text-center hidden font-medium mt-4">City not found or network error. Try again.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
